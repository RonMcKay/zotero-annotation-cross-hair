name: PR title

# main is squash-merged, so the PR title becomes the commit message that
# semantic-release reads. It must be a Conventional Commit.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      # Third-party action running on fork PRs via pull_request_target:
      # pinned to a commit so a moved tag can't change what runs here.
      # Dependabot keeps the SHA (and the version comment) up to date.
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
