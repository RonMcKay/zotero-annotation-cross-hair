name: Release

# Run manually from the Actions tab. semantic-release derives the next
# version from the Conventional Commits on main since the last tag, builds
# the .xpi with that version, tags, publishes a GitHub release and refreshes
# the auto-update manifest. Nothing is committed back to the repository.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only report the next version and release notes
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Seed v0.0.0 so the first release is 0.1.0
        run: bash scripts/seed-initial-tag.sh
      - name: semantic-release
        run: npx semantic-release ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
