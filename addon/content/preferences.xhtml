<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox onload="Zotero.__addonInstance__.hooks.onPrefsLoad(window)">
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-enabled"
    preference="enabled"
    data-l10n-id="pref-enabled"
  />
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-color-light"
      data-l10n-id="pref-color-light"
    ></html:label>
    <html:input type="color" id="zotero-prefpane-__addonRef__-color-light" />
    <button
      id="zotero-prefpane-__addonRef__-color-light-reset"
      data-l10n-id="pref-color-reset"
    />
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-color-dark"
      data-l10n-id="pref-color-dark"
    ></html:label>
    <html:input type="color" id="zotero-prefpane-__addonRef__-color-dark" />
    <button
      id="zotero-prefpane-__addonRef__-color-dark-reset"
      data-l10n-id="pref-color-reset"
    />
  </hbox>
  <html:p data-l10n-id="pref-help"></html:p>
</groupbox>
